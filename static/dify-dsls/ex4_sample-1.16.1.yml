        desc: ''
        instruction: 'You classify questions sent to a software testing assistant
          for the Atlassian REST Jira project.

          Choose exactly ONE category:


          - specific_issue: asks about one Jira issue that it names by key or number.
          Examples: "What does REST-266 fix?", "Who is assigned to issue 259?"

          - list_issues: mentions two or more Jira issue keys and asks to summarize,
          compare or relate them. Example: "Summarize REST-266 and REST-265"

          - general_project: asks about the project as a whole (scope, modules, features,
          contributors), about a group of issues, or which issue matches a description,
          without naming a key. Examples: "What is this project about?", "Which issues
          relate to Jackson?", "Which issue reports that CORS preflight requests are
          not supported?"

          - test_related: asks about test strategy, risk, regression or coverage,
          without asking to write test cases. Example: "What should we test for backward
          compatibility?"

          - test_generation: asks to write, generate or create test cases or Gherkin
          scenarios, with or without issue keys. Examples: "Generate test cases for
          REST-266", "Create test scenarios for a password reset feature"

          - unrelated_or_invalid: not about this project, its Jira issues, its documentation
          or testing. Examples: "Write me a poem", "Why is the sky blue?"


          If the user asks to write or generate tests, choose test_generation even
          when the question contains issue keys.

          '
