    - data:
        code: "import re\n\n\ndef main(inputs: list, expected_keys: list) -> dict:\n\
          \    flat_context = []\n    for item in inputs:\n        if isinstance(item,\
          \ list):\n            flat_context.extend(value for value in item if isinstance(value,\
          \ dict))\n        elif isinstance(item, dict):\n            flat_context.append(item)\n\
          \n    expected = [str(key).upper() for key in expected_keys if key]\n  \
          \  retrieved_keys = set(re.findall(\n        r\"(?<![A-Z0-9-])[A-Z][A-Z0-9]+-\\\
          d+(?![A-Z0-9-])\",\n        str(flat_context).upper(),\n    ))\n    completed\
          \ = [key for key in expected if key in retrieved_keys]\n    missing = [key\
          \ for key in expected if key not in retrieved_keys]\n\n    if not expected:\n\
          \        batch_status = \"No Jira issue keys were requested.\"\n    elif\
          \ not completed:\n        batch_status = \"No requested Jira issues were\
          \ retrieved: \" + \", \".join(expected) + \".\"\n    elif missing:\n   \
          \     batch_status = \"Partial result: retrieved \" + str(len(completed))\
          \ + \" of \" + str(len(expected)) + \" requested issues. Missing: \" + \"\
          , \".join(missing) + \".\"\n    else:\n        batch_status = \"Complete\
          \ result: retrieved all \" + str(len(expected)) + \" requested issues.\"\
          \n\n    return {\"flat_context\": flat_context, \"batch_status\": batch_status}\n"
